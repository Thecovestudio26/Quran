# Deploys the phone planner (installable PWA) to GitHub Pages.
# The site is published at: https://thecovestudio26.github.io/Quran/
name: Deploy phone app to GitHub Pages

on:
  push:
    branches: [vibe/quran-journal-5349f6]
    paths: ["phone-app/**", ".github/workflows/deploy-app.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate app icons (PNG)
        run: node phone-app/make-icons.js

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "phone-app"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
