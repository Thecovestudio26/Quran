# Deploys the phone planner (installable PWA) to GitHub Pages.
# The site is published at: https://thecovestudio26.github.io/Quran/
name: Deploy phone app to GitHub Pages

on:
  push:
    branches: [vibe/quran-journal-5349f6]
    paths: ["phone-app/**", ".github/workflows/deploy-app.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate app icons (PNG)
        run: node phone-app/make-icons.js

      - name: Enable GitHub Pages if needed
        run: |
          code=$(curl -s -o /tmp/pages.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}')
          echo "Enable Pages HTTP $code"
          cat /tmp/pages.json
          if [ "$code" != "201" ] && [ "$code" != "409" ]; then
            echo "::warning::Could not enable Pages (HTTP $code). Enable it in Settings > Pages with Source 'GitHub Actions'."
          fi

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "phone-app"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
